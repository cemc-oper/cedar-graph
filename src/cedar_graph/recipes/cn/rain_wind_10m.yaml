api_version: cedarkit.plots/v2
kind: PlotRecipe
metadata:
  annotations:
    cedarkit.plots/migrated-from: v1
  labels: {}
  name: cn.rain_wind_10m
  title: 'surface cumulated precipitation: {previous_forecast_hour:03d}-{forecast_hour:03d}h'
spec:
  colorbar:
    layer: 0
  data:
    rain:
      field:
        parameter: cedarkit.rain
      legacy_unit_compatibility: false
      transforms:
      - args:
        - '{params.interval}'
        kwargs: {}
        op: time_diff
        repeat: 1
      units: mm
    u_10m:
      field:
        level:
          first_level: 10
          first_level_type: 103
        parameter: cedarkit.u
      legacy_unit_compatibility: false
      transforms: []
      units: m/s
    v_10m:
      field:
        level:
          first_level: 10
          first_level_type: 103
        parameter: cedarkit.v
      legacy_unit_compatibility: false
      transforms: []
      units: m/s
  domain:
    area: cn_area
    default: east_asia
  layers:
  - field: rain
    style:
      by: interval
      cases:
        '1': rain:cn_1h
        '12': rain:cn_12h
        '24': rain:cn_24h
        '3': rain:cn_3h
        '6': rain:cn_6h
        else: rain:cn_24h
  - layer:
    - 0
    style: wind:cn
    vector:
      u: u_10m
      v: v_10m
  params:
    interval:
      required: true
      type: timedelta
  title:
    area_prefix: false
    graph_name: 'surface cumulated precipitation: {previous_forecast_hour:03d}-{forecast_hour:03d}h'
