api_version: cedarkit.plots/v2
kind: PlotRecipe
metadata:
  annotations:
    cedarkit.plots/migrated-from: v1
  labels: {}
  name: cn.bli_wind
  title: BLI(shadow) and {wind_level}hPa Wind(m/s)
spec:
  colorbar:
    layer: 0
  data:
    bli:
      field:
        parameter: cedarkit.bli
      legacy_unit_compatibility: false
      transforms: []
      units: K
    u:
      field:
        level:
          first_level: '{params.wind_level}'
          first_level_type: 100
        parameter: cedarkit.u
      legacy_unit_compatibility: false
      transforms: []
      units: m/s
    v:
      field:
        level:
          first_level: '{params.wind_level}'
          first_level_type: 100
        parameter: cedarkit.v
      legacy_unit_compatibility: false
      transforms: []
      units: m/s
  domain:
    area: cn_area
    default: east_asia
  layers:
  - field: bli
    style: bli:cn_fill
  - field: bli
    style: bli:cn_line
  - layer:
    - 0
    style: wind:cn
    vector:
      u: u
      v: v
  params:
    wind_level:
      required: true
      type: float
  title:
    area_prefix: true
    graph_name: BLI(shadow) and {params.wind_level}hPa Wind(m/s)
