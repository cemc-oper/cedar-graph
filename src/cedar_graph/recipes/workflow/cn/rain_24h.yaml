api_version: cedarkit.plots/v3
kind: PlotRecipe
metadata:
  name: cn.rain_24h
  title: '24-hour total precipitation: {context.previous_forecast_hour}-{context.forecast_hour}h'
spec:
  params:
    model:
      type: str
      default: CMA-GFS
    interval:
      type: enum
      default: 24h
      values:
      - 24h
  data:
    rain:
      field:
        parameter: cedarkit.rain.since-initialization
      transforms:
      - args:
        - '{params.interval}'
        kwargs:
          since_initialization: true
        op: time_diff
        repeat: 1
      units: mm
      source_units: mm
  content:
    charts:
    - id: main
      plots:
      - id: rain_0
        method: contourf
        field: rain
        style: cemc.rain:cn
        targets: all
        data_crs: plate_carree
      titles:
      - id: heading
        text: |-
          24-hour total precipitation: {context.previous_forecast_hour}-{context.forecast_hour}h (mm)
          {params.model} | Init {context.start_time_label} | Valid {context.valid_time_label}
    colorbars:
    - id: fields
      plots:
      - chart: main
        plot: rain_0
      label: mm
  display:
    template: east_asia
    charts:
      main:
        decorations:
          titles:
            heading:
              fontsize: 9
