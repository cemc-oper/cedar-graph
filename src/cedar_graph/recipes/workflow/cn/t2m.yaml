api_version: cedarkit.plots/v3
kind: PlotRecipe
metadata:
  name: cn.t2m
  title: 2m Temperature (C)
spec:
  params:
    model:
      type: str
      default: CMA-GFS
    style_variant:
      type: enum
      default: cn_summer
      values:
      - cn_summer
      - cn_winter
  data:
    temperature:
      field:
        parameter: cedarkit.t2m
      units: degC
      temperature_kind: absolute
      source_units: K
  content:
    charts:
    - id: main
      plots:
      - id: temperature
        method: contourf
        field: temperature
        style: cemc.t2m:{params.style_variant}
        targets: all
        data_crs: plate_carree
      titles:
      - id: heading
        text: 2 m Temperature (°C)
      - id: model
        text: "{params.model}"
      - id: init
        text: |-
          Init {context.start_time_label}
          {context.start_time_cst_label}
      - id: lead
        text: "{context.forecast_lead_label}"
      - id: valid
        text: |-
          Valid {context.valid_time_label}
          {context.valid_time_cst_label}
      colorbars:
      - id: temperature
        plots:
        - chart: main
          plot: temperature
        label: °C
  display:
    template: east_asia
