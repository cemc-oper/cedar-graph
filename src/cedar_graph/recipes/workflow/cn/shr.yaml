api_version: cedarkit.plots/v3
kind: PlotRecipe
metadata:
  name: cn.shr.default
  title: '{params.area_name} {params.second_level}-{params.first_level}m shear (m/s)'
spec:
  params:
    first_level:
      type: enum
      required: true
      values:
      - 1000
      - 3000
      - 6000
    second_level:
      type: int
      default: 0
    area_name:
      type: str
      default: ''
  data:
    shr:
      field:
        parameter: cedarkit.shr
        level:
          first_level_type: 103
          first_level: '{params.first_level}'
          second_level_type: 103
          second_level: '{params.second_level}'
      transforms:
      - op: smth9
        args:
        - 0.5
        - -0.25
        - false
        repeat: 3
      source_units: m/s
      units: m/s
  content:
    charts:
    - id: main
      plots:
      - id: shr_plot
        method: contourf
        field: shr
        style: cemc.shr:cn_fill
        targets: all
        data_crs: plate_carree
      - id: shr_line
        method: contour
        field: shr
        style: cemc.shr:cn_line
        targets: all
        data_crs: plate_carree
      titles:
      - id: heading
        text: '{params.area_name} {params.second_level}-{params.first_level}m shear
          (m/s)'
    colorbars:
    - id: fields
      plots:
      - chart: main
        plot: shr_plot
      label: m/s
  display:
    template: east_asia
