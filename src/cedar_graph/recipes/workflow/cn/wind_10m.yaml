api_version: cedarkit.plots/v3
kind: PlotRecipe
metadata:
  name: cn.wind_10m
  title: 10m Wind and Wind Speed (m/s)
spec:
  params:
    model:
      type: str
      default: CMA-GFS
  data:
    u_10m:
      field:
        level:
          first_level: 10
          first_level_type: 103
        parameter: cedarkit.u10m
      units: m/s
      source_units: m/s
    v_10m:
      field:
        level:
          first_level: 10
          first_level_type: 103
        parameter: cedarkit.v10m
      units: m/s
      source_units: m/s
    ws_10m:
      compute:
        args: []
        inputs:
        - u_10m
        - v_10m
        kwargs: {}
        op: wind_speed
      source_units: m/s
      units: m/s
  content:
    charts:
    - id: main
      plots:
      - id: ws_10m_0
        method: contourf
        field: ws_10m
        style: cemc.ws_10m:cn
        targets: all
        data_crs: plate_carree
      - id: wind_1
        method: barbs
        max_vectors: 20000
        vector:
          u: u_10m
          v: v_10m
        style: cemc.wind:cn_mps
        targets: main
        data_crs: plate_carree
        vector_basis: earth
      titles:
      - id: heading
        text: |-
          10m Wind and Wind Speed (m/s)
          {params.model} | Init {context.start_time_label} | Valid {context.valid_time_label} | +{context.forecast_hour}h
          Barbs: half 2 / full 4 / flag 20 m/s
    colorbars:
    - id: fields
      plots:
      - chart: main
        plot: ws_10m_0
      label: m/s
  display:
    template: east_asia
    charts:
      main:
        decorations:
          titles:
            heading:
              fontsize: 9
