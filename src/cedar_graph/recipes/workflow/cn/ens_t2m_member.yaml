api_version: cedarkit.plots/v3
kind: PlotRecipe
metadata:
  name: cn.ens_t2m.member
  title: Ensemble 2m temperature member
spec:
  params:
    member_id: {type: str, required: true}
    style_variant:
      type: enum
      default: cn_summer
      values: [cn_summer, cn_winter]
  data:
    temperature:
      field:
        parameter: cedarkit.t2m
        level: {member: '{params.member_id}'}
      source_units: K
      units: degC
      temperature_kind: absolute
  content:
    charts:
      - id: member
        plots:
          - id: temperature
            method: contourf
            field: temperature
            style: 'cemc.t2m:{params.style_variant}'
            data_crs: plate_carree
