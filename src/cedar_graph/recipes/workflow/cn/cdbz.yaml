  title: Radar Composite Reflectivity(dBZ)
spec:
  params: {}
  data:
    cdbz:
      field:
        parameter: cedarkit.cdbz
      transforms:
      - args:
        - 0.5
        - -0.25
        - false
        kwargs: {}
        op: smth9
        repeat: 2
      units: dbz
      source_units: dBZ
  content:
