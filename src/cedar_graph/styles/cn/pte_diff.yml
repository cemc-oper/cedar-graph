# 假相当位温差（pte_wind 图形，由两层次 pte 派生）。填色 + 等值线叠加。
id: pte_diff
criteria:
  - cemc_name: pte_diff
optimal: cn_fill

styles:
  cn_fill:
    type: contour
    levels: [-40, -35, -30, -25, -20, -15, -10, -5, 0, 5]
    colormap: { rgb_table: cn_pte }
    fill: true

  cn_line:
    type: contour
    levels: [-40, -35, -30, -25, -20, -15, -10, -5, 0, 5]
    colormap: { colors: [black] }
    linewidth: 0.6
    linestyles: solid
    label: { color: black, background_color: white, fontsize: 8 }
