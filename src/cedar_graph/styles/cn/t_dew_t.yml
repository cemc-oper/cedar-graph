# 温度露点差（t_dew_t 图形，由 t 与 td 派生）。
# cn_fill/cn_line 为温度露点差填色与等值线；cn_t 为温度等值线（0 度线加粗变黑）。
id: t_dew_t
criteria:
  - cemc_name: t_dew_t
optimal: cn_fill

styles:
  cn_fill:
    type: contour
    levels: [1, 3, 5, 7, 9, 11, 15, 17, 21, 25, 29, 33]
    colormap:
      rgb_table: cn_tdew
      index: [65, 70, 75, 80, 85, 100, 115, 130, 150, 160, 170, 180, 190]
      index_offset: -2
    fill: true

  cn_line:
    type: contour
    levels: [1, 3, 5, 7, 9, 11, 15, 17, 21, 25, 29, 33]
    colormap:
      rgb_table: cn_tdew
      index: [65, 70, 75, 80, 85, 100, 115, 130, 150, 160, 170, 180, 190]
      index_offset: -2
    linewidth: 0.1
    highlight:
      level: 5
      color_index: 199
      linewidth: 2.0

  cn_t:
    type: contour
    levels: { linspace: [-80, 80, 81] }
    colormap: { rgb_table: cn_tdew, index: 28 }
    linewidth: 1.0
    linestyles: solid
    highlight:
      level: 0
      color: [0, 0, 0, 0]   # 原实现即 RGBA 全透明（注释称 black），保持一致
      linewidth: 2.0
    label: { background_color: white, line_colors: true }
