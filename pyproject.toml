[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "cedar-graph"
authors = [
    {name="Wang Dapeng", email="perillaroc@gmail.com"}
]
description = "Plot tool for CEMC."
readme = "README.md"
keywords = ["graphic", "cemc", "cedarkit"]
license = { text = "Apache-2.0" }
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",

    "Intended Audience :: Developers",

    'License :: OSI Approved :: Apache Software License',

    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "cartopy",
    "xarray",
    "loguru",
    'importlib-metadata; python_version<"3.8"',
    "reki>=2026.8.0",
    "cedarkit-comp>=2026.7.0",
    "cedarkit-plots>=2026.8.0",
]

[project.urls]
Homepage = "https://github.com/cemc-oper/cedar-graph"
Repository = "https://github.com/cemc-oper/cedar-graph.git"

[project.entry-points."cedarkit.plots.styles"]
cn = "cedar_graph.styles"

[project.optional-dependencies]
test = ["pytest"]
cov = ["pytest-cov", "codecov"]
docs = [
    "sphinx>=7.3",
    "sphinx-book-theme>=1.1",
    "myst-nb>=1.1",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
    "linkify-it-py>=2.0",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "docs", "example"]
namespaces = false

[tool.setuptools]
include-package-data = true

[tool.setuptools_scm]
version_file = "cedar_graph/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests/mock"]

[tool.uv.sources]
cedarkit-plots = { path = "../cedarkit-plots", editable = true }
cedarkit-comp = { path = "../cedarkit-comp", editable = true }
reki = { path = "../reki", editable = true }
