api_version: cedarkit.plots/v2
kind: PlotRecipe
metadata:
  annotations:
    cedarkit.plots/migrated-from: v1
  labels: {}
  name: cn.kidx_wind
  title: K index(shadow) {wind_level}hPa Wind(m/s)
spec:
  colorbar:
    layer: 0
  data:
    kidx:
      field:
        parameter: cedarkit.kidx
      legacy_unit_compatibility: false
      transforms: []
      units: K
    u:
      field:
        level:
          first_level: '{params.wind_level}'
          first_level_type: 100
        parameter: cedarkit.u
      legacy_unit_compatibility: false
      transforms: []
      units: m/s
    v:
      field:
        level:
          first_level: '{params.wind_level}'
          first_level_type: 100
        parameter: cedarkit.v
      legacy_unit_compatibility: false
      transforms: []
      units: m/s
  domain:
    area: cn_area
    default: east_asia
  layers:
  - field: kidx
    style: kidx:cn_fill
  - field: kidx
    style: kidx:cn_line
  - layer:
    - 0
    style: wind:cn
    vector:
      u: u
      v: v
  params:
    wind_level:
      required: true
      type: float
  title:
    area_prefix: true
    graph_name: K index(shadow) {params.wind_level}hPa Wind(m/s)
