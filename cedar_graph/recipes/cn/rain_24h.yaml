api_version: cedarkit.plots/v2
kind: PlotRecipe
metadata:
  annotations:
    cedarkit.plots/migrated-from: v1
  labels: {}
  name: cn.rain_24h
  title: 'surface cumulated precipitation: {previous_forecast_hour:03d}-{forecast_hour:03d}h'
spec:
  colorbar:
    layer: 0
  data:
    rain:
      field:
        parameter: cedarkit.rain
      legacy_unit_compatibility: false
      transforms:
      - args:
        - '{params.interval}'
        kwargs: {}
        op: time_diff
        repeat: 1
      units: mm
  domain:
    area: cn_area
    default: east_asia
  layers:
  - field: rain
    style: rain:cn
  params:
    interval:
      default: 24h
      required: false
      type: timedelta
  title:
    area_prefix: false
    graph_name: 'surface cumulated precipitation: {previous_forecast_hour:03d}-{forecast_hour:03d}h'
