# CAPE + 风羽（参数化层次）。
name: "CAPE(J/kg) & {wind_level}hPa Wind(m/s)"
domain: { default: east_asia, area: cn_area }

params:
  wind_level: { type: float, required: true }

data:
  cape: { field: cape }
  u:
    field: u
    level: { first_level_type: 100, first_level: "{wind_level}" }
  v:
    field: v
    level: { first_level_type: 100, first_level: "{wind_level}" }

layers:
  - field: cape
    style: cape:cn_fill
  - field: cape
    style: cape:cn_line
  - vector: { u: u, v: v }
    style: wind:cn
    layer: [0]

title: { graph_name: "CAPE(J/kg) & {wind_level}hPa Wind(m/s)", area_prefix: true }
colorbar: { layer: 0 }
