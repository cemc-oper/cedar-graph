api_version: cedarkit.plots/v2
kind: PlotRecipe
metadata:
  annotations:
    cedarkit.plots/migrated-from: v1
  labels: {}
  name: cn.cape_wind
  title: CAPE(J/kg) & {wind_level}hPa Wind(m/s)
spec:
  colorbar:
    layer: 0
  data:
    cape:
      field:
        parameter: cedarkit.cape
      legacy_unit_compatibility: false
      transforms: []
      units: J/kg
    u:
      field:
        level:
          first_level: '{params.wind_level}'
          first_level_type: 100
        parameter: cedarkit.u
      legacy_unit_compatibility: false
      transforms: []
      units: m/s
    v:
      field:
        level:
          first_level: '{params.wind_level}'
          first_level_type: 100
        parameter: cedarkit.v
      legacy_unit_compatibility: false
      transforms: []
      units: m/s
  domain:
    area: cn_area
    default: east_asia
  layers:
  - field: cape
    style: cape:cn_fill
  - field: cape
    style: cape:cn_line
  - layer:
    - 0
    style: wind:cn
    vector:
      u: u
      v: v
  params:
    wind_level:
      required: true
      type: float
  title:
    area_prefix: true
    graph_name: CAPE(J/kg) & {params.wind_level}hPa Wind(m/s)
