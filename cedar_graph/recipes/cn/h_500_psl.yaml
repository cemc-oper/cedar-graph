api_version: cedarkit.plots/v2
kind: PlotRecipe
metadata:
  annotations:
    cedarkit.plots/migrated-from: v1
  labels: {}
  name: cn.h_500_psl
  title: 500 hPa Height(10gpm), Sea Level Pressure(hPa,shadow)
spec:
  colorbar:
    layer: 0
  data:
    h_500:
      field:
        level:
          first_level: 500
          first_level_type: 100
        parameter: cedarkit.h
      legacy_unit_compatibility: false
      transforms:
      - args:
        - 0.5
        - 0.25
        - false
        kwargs: {}
        op: smth9
        repeat: 4
      units: dagpm
    psl:
      field:
        parameter: cedarkit.psl
      legacy_unit_compatibility: false
      transforms:
      - args:
        - 0.5
        - -0.25
        - false
        kwargs: {}
        op: smth9
        repeat: 2
      units: hPa
  domain:
    area: cn_area
    default: east_asia
  layers:
  - field: psl
    style: psl:cn
  - field: h_500
    style: h_500:cn_dagpm
  params: {}
  title:
    area_prefix: false
    graph_name: 500 hPa Height(10gpm), Sea Level Pressure(hPa,shadow)
