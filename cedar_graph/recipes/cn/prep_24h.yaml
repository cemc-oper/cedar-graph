api_version: cedarkit.plots/v2
kind: PlotRecipe
metadata:
  annotations:
    cedarkit.plots/migrated-from: v1
  labels: {}
  name: cn.prep_24h
  title: 'surface cumulated precipitation: {previous_forecast_hour:03d}-{forecast_hour:03d}h'
spec:
  colorbar:
    layer:
    - 0
    - 2
    - 1
  data:
    classified:
      compute:
        args: []
        inputs:
        - rain_total
        - snow_total
        kwargs: {}
        op: prep_classify
        outputs:
        - rain
        - rain_snow
        - snow
        repeat: 1
      legacy_unit_compatibility: false
      transforms: []
    rain_total:
      field:
        parameter: cedarkit.rain
      legacy_unit_compatibility: false
      transforms:
      - args:
        - '{params.interval}'
        kwargs: {}
        op: time_diff
        repeat: 1
      units: mm
    snow_total:
      field:
        parameter: cedarkit.sf
      legacy_unit_compatibility: false
      transforms:
      - args:
        - '{params.interval}'
        kwargs: {}
        op: time_diff
        repeat: 1
      units: mm
  domain:
    area: cn_area
    default: east_asia
  layers:
  - field: rain
    style: rain:cn_prep
  - field: snow
    style: sf
  - field: rain_snow
    style: rain_snow
  params:
    interval:
      default: 24h
      required: false
      type: timedelta
  title:
    area_prefix: false
    graph_name: 'surface cumulated precipitation: {previous_forecast_hour:03d}-{forecast_hour:03d}h'
