# 24 小时降水相态（雨/雨夹雪/雪）。雪雨比分类是诊断逻辑，由 cedar-graph
# 注册的多输出 compute op prep_classify 完成（schema 为此引入 outputs 扩展，
# 见设计文档 §4.5 评审纪要）。
name: "surface cumulated precipitation: {previous_forecast_hour:03d}-{forecast_hour:03d}h"
domain: { default: east_asia, area: cn_area }

params:
  interval: { type: timedelta, default: 24h }

data:
  rain_total:
    field: apcp
    transforms:
      - { op: time_diff, args: ["{interval}"] }
  snow_total:
    field: asnow
    transforms:
      - { op: time_diff, args: ["{interval}"] }
      - { op: unit_scale, args: [1000] }                 # m -> mm
  classified:
    compute: { op: prep_classify, inputs: [rain_total, snow_total], outputs: [rain, rain_snow, snow] }

layers:
  - field: rain
    style: rain:cn_prep
  - field: snow
    style: sf
  - field: rain_snow
    style: rain_snow

title: { graph_name: "surface cumulated precipitation: {previous_forecast_hour:03d}-{forecast_hour:03d}h" }
colorbar: { layer: [0, 2, 1] }                         # rain, rain_snow, snow
