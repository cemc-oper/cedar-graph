# 垂直风切变。levels 由数据范围按 NCL nice-values 算法在运行时计算
# （calculate_levels_automatic），此处仅声明色标；绘图模块填充 levels。
id: shr
criteria:
  - cemc_name: shr
  - wgrib2_name: VWSH
  - eccodes_name: vwsh
optimal: cn_fill

styles:
  cn_fill:
    type: contour
    colormap:
      rgb_table: cn_shr
      index: [2, 4, 5, 6, 8, 13, 69, 73, 76, 79, 65, 64, 63, 62, 60, 58, 35]
      index_offset: -2
    fill: true

  cn_line:
    type: contour
    colormap: { colors: [blue] }
    linewidth: 0.3
